<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mapping des genres et sceaux de groupe</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 28px; background:#0a0a0b; color:#e8e8ea;
         font-family: Inter, "Segoe UI", system-ui, sans-serif; width:1080px; }
  h2 { font-size:12px; letter-spacing:1.6px; text-transform:uppercase; color:#9aa0a8; margin:0 0 10px; }
  h2.sub { margin-top:30px; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th { text-align:left; font-weight:600; font-size:10.5px; letter-spacing:1px; text-transform:uppercase;
       color:#7e848c; padding:7px 10px; border-bottom:1px solid #26272b; }
  td { padding:7px 10px; border-bottom:1px solid #18191c; vertical-align:middle; }
  tr:nth-child(even) td { background:#0e0f11; }
  td.fam { font-weight:600; white-space:nowrap; }
  td.prio { text-align:right; color:#7e848c; width:48px; }
  td.ex { color:#9aa0a8; font-size:11.5px; }
  .chips { display:flex; }
  .chips i { display:block; width:24px; height:15px; }
  .chips i:first-child { border-radius:2px 0 0 2px; }
  .chips i:last-child { border-radius:0 2px 2px 0; }
  .seals { display:flex; gap:14px; flex-wrap:wrap; }
  .seal { text-align:center; width:120px; }
  .seal svg { width:60px; height:60px; margin:0 auto; }
  .seal div { font-size:10.5px; color:#8a9099; margin-top:5px; line-height:1.3; }
</style>
</head>
<body>
<h2>Table de mapping des genres — 17 familles racines</h2>
<table id="tbl">
  <thead><tr><th>Famille racine</th><th>Palette</th><th>Prio.</th><th>Genres Wikidata qui y retombent</th></tr></thead>
  <tbody></tbody>
</table>

<h2 class="sub">Sceaux de groupe — générés, jamais dessinés</h2>
<div class="seals" id="seals"></div>

<script>
const FAMILIES=[
 ["Métal","#121214","#B8352F","#6E7276",1,"heavy metal, death metal, metal progressif, metal industriel, black metal"],
 ["Punk & hardcore","#141416","#E04A2F","#F0E9D8",2,"punk rock, hardcore punk, post-punk, oi!, crust"],
 ["Hip-hop","#121410","#C8D44E","#6E7A52",3,"rap, gangsta rap, boom bap, trap, drill, rap conscient"],
 ["Électronique","#0B1220","#3FC1C9","#7A86D6",4,"techno, house, drum and bass, ambient, IDM, EBM"],
 ["Reggae & dub","#0F1610","#D9B52B","#4E9B5A",5,"reggae, dub, ska, rocksteady, dancehall, ragga"],
 ["Afro","#16120C","#E09A2B","#4F8C6E",6,"afrobeat, afropop, highlife, mbalax, amapiano, soukous"],
 ["Latin","#1C1210","#D4552F","#E0A83C",7,"salsa, bossa nova, cumbia, tango, reggaeton, samba"],
 ["Jazz","#0E1A1C","#D8B35C","#6FA3A0",8,"bebop, cool jazz, free jazz, jazz modal, swing, hard bop"],
 ["Blues","#0C1420","#4A7FB5","#C4A062",9,"delta blues, chicago blues, blues rock, boogie-woogie"],
 ["Funk & disco","#1A1222","#E0A32B","#C04FA8",10,"funk, disco, p-funk, boogie, funk rock"],
 ["R&B & soul","#1A1012","#C47A5A","#8E6B8C",11,"soul, rhythm and blues, motown, neo soul, contemporary R&B"],
 ["Country","#171310","#C89A4A","#8C6E4E",12,"country, bluegrass, honky-tonk, americana, outlaw country"],
 ["Folk","#121710","#9CB06A","#C4A878",13,"folk, singer-songwriter, folk rock, néo-folk, protest song"],
 ["Musiques du monde","#101614","#B58A4E","#5E8C86",14,"musique traditionnelle, fado, flamenco, raï, qawwali, musique celtique"],
 ["Chanson & variété","#16131A","#C9869B","#A08C5E",15,"chanson française, schlager, canzone, variété, yé-yé"],
 ["Pop","#1C1020","#D45E8A","#E0B36A",16,"pop, synthpop, dream pop, J-pop, K-pop, teen pop"],
 ["Rock","#15110E","#D98A2B","#8A6A4F",17,"rock, rock alternatif, rock progressif, indie rock, grunge, garage"]
];
document.querySelector("#tbl tbody").innerHTML = FAMILIES.map(f=>
 `<tr><td class="fam">${f[0]}</td>
      <td><span class="chips"><i style="background:${f[1]}"></i><i style="background:${f[2]}"></i><i style="background:${f[3]}"></i></span></td>
      <td class="prio">${f[4]}</td><td class="ex">${f[5]}</td></tr>`).join("");

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed;return()=>{a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function gcd(a,b){return b?gcd(b,a%b):a;}
function starSteps(n){const o=[];for(let k=2;k<n/2;k++) if(gcd(n,k)===1) o.push(k); return o;}
function starPoints(n,k,c,r){const p=[];for(let i=0;i<=n;i++){const t=((i*k)/n)*Math.PI*2-Math.PI/2;
  p.push(`${(c+Math.cos(t)*r).toFixed(1)},${(c+Math.sin(t)*r).toFixed(1)}`);} return p.join(" ");}

function seal(band){
  const rnd=rng(hash(band)), size=60, c=size/2, r=size/2-6, ro=r+4;
  const ring=Math.floor(rnd()*4);
  let n=7+Math.floor(rnd()*7), st=starSteps(n);
  while(!st.length){ n++; st=starSteps(n); }
  const k=st[Math.floor(rnd()*st.length)];
  const core=Math.floor(rnd()*4);
  const ticks=[0,6,8,12][Math.floor(rnd()*4)];
  const gold="#D8B35C", bronze="#B08D57";
  let o="";
  if(ring===0) o+=`<circle cx="${c}" cy="${c}" r="${ro}" fill="none" stroke="${bronze}" stroke-width="0.9" opacity="0.6"/>`;
  if(ring===1) o+=`<circle cx="${c}" cy="${c}" r="${ro}" fill="none" stroke="${bronze}" stroke-width="0.9" opacity="0.6"/><circle cx="${c}" cy="${c}" r="${ro-2.6}" fill="none" stroke="${bronze}" stroke-width="0.5" opacity="0.45"/>`;
  if(ring===2) o+=`<circle cx="${c}" cy="${c}" r="${ro}" fill="none" stroke="${bronze}" stroke-width="1" opacity="0.65" stroke-dasharray="2 2.6"/>`;
  if(ring===3) o+=`<circle cx="${c}" cy="${c}" r="${ro}" fill="none" stroke="${bronze}" stroke-width="1.6" opacity="0.5" stroke-dasharray="9 3.5"/>`;
  for(let i=0;i<ticks;i++){ const t=(i/ticks)*Math.PI*2-Math.PI/2;
    o+=`<line x1="${(c+Math.cos(t)*(ro-1.4)).toFixed(1)}" y1="${(c+Math.sin(t)*(ro-1.4)).toFixed(1)}" x2="${(c+Math.cos(t)*(ro-4)).toFixed(1)}" y2="${(c+Math.sin(t)*(ro-4)).toFixed(1)}" stroke="${bronze}" stroke-width="0.8" opacity="0.7"/>`; }
  o+=`<polyline points="${starPoints(n,k,c,r)}" fill="none" stroke="${gold}" stroke-width="1.1" opacity="0.95"/>`;
  if(core===0) o+=`<circle cx="${c}" cy="${c}" r="1.8" fill="${gold}"/>`;
  if(core===1) o+=`<circle cx="${c}" cy="${c}" r="${(r*0.3).toFixed(1)}" fill="none" stroke="${gold}" stroke-width="0.9" opacity="0.85"/>`;
  if(core===2) o+=`<polyline points="${starPoints(n,k,c,r*0.42)}" fill="none" stroke="${bronze}" stroke-width="0.7" opacity="0.8"/>`;
  if(core===3) o+=`<circle cx="${c}" cy="${c}" r="${(r*0.22).toFixed(1)}" fill="none" stroke="${gold}" stroke-width="0.8" opacity="0.85"/><circle cx="${c}" cy="${c}" r="1.4" fill="${gold}"/>`;
  return `<div class="seal"><svg viewBox="0 0 ${size} ${size}">${o}</svg><div>${band}</div></div>`;
}
document.getElementById("seals").innerHTML = [
 "Dream Theater","Slipknot","Marilyn Manson","The Velvet Underground",
 "Fela Kuti & Africa 70","Les Rita Mitsouko","A Tribe Called Quest","Can",
 "Massive Attack","Sonic Youth","Buena Vista Social Club","Kraftwerk"
].map(seal).join("");
</script>
</body>
</html>
