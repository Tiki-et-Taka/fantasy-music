<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Fantasy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --bg-elev: #141414;
    --ink: #f2f0eb;
    --muted: #8a8680;
    --line: #2a2a2a;
    --line-hi: #3a3a3a;
    --accent: #e68a1e;
    --accent-ink: #111;
    --panel: #161616;
    --danger: #e05050;
    --font-display: "Archivo Black", "Oswald", Impact, sans-serif;
    --font-ui: "Oswald", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
  }
  a { color: inherit; }
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    opacity: .14;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .top {
    position: sticky; top: 0; z-index: 20;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    background: rgba(13,13,13,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    justify-self: start;
    font-family: var(--font-display);
    font-size: clamp(22px, 3vw, 30px);
    letter-spacing: .04em;
    text-transform: uppercase;
    text-decoration: none;
    line-height: 1;
  }
  .nav-main {
    justify-self: center;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px;
  }
  .nav-main a {
    position: relative;
    text-decoration: none;
    font-size: 13px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); padding: 6px 0 8px;
  }
  .nav-main a:hover { color: var(--ink); }
  .nav-main a.on { color: var(--ink); }
  .nav-main a.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--accent);
  }
  .top-actions {
    justify-self: end; display: flex; align-items: center; gap: 10px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--panel);
    padding: 8px 12px; font-size: 12px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
    white-space: nowrap;
  }
  .chip .coin {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0c060, var(--accent) 55%, #8a4a10);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  }
  .chip.btn {
    appearance: none; font: inherit; cursor: pointer; color: inherit;
  }
  .chip.btn .ico { width: 16px; height: 16px; }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  .page-head {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .page-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(36px, 6vw, 56px);
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: .95;
  }
  .page-sub {
    margin: 12px 0 0;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .02em;
    color: var(--ink);
  }

  .tabs {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 22px;
  }
  .tab {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 9px 14px;
    cursor: pointer;
  }
  .tab:hover { border-color: var(--line-hi); }
  .tab.on {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .comp-list { display: grid; gap: 14px; }
  .comp {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px 24px;
    align-items: center;
    border: 1px solid var(--line-hi);
    background: transparent;
    padding: 18px 20px;
  }
  .comp.has-lineup {
    grid-template-columns: 1fr auto auto;
  }
  .comp.soon { opacity: .72; }
  .comp-minis {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .comp-mini {
    position: relative;
    width: 56px;
    height: 78px;
    flex: 0 0 auto;
    overflow: hidden;
    border-radius: 4px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
  }
  .comp-mini.empty {
    border: 1px dashed var(--line-hi);
    background: transparent;
    filter: none;
  }
  .comp-mini .card {
    position: absolute; top: 0; left: 0;
    transform-origin: top left;
    pointer-events: none;
  }
  .comp-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    justify-self: end;
  }
  @media (max-width: 900px) {
    .comp.has-lineup {
      grid-template-columns: 1fr;
    }
    .comp-minis { order: 2; }
    .comp-actions,
    .comp-cta { justify-self: start; order: 3; }
    .comp-actions { align-items: flex-start; }
  }

  /* carte miniature (même DA booster / classeur) */
  .card {
    position: relative; width: 260px; height: 364px;
    border-radius: 10px; overflow: hidden;
    background: #0F1012;
  }
  .card.paper { background: #EDE4D4; }
  .art {
    position: absolute; top: 12px; left: 12px; right: 12px; bottom: 120px;
    overflow: hidden; background: #111;
  }
  .art img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 18%;
    display: block;
  }
  .card.paper .art { background: #E6D9C4; }
  .card.paper .art img { object-position: center top; }
  .band {
    position: absolute; left: 12px; right: 12px; bottom: 12px; height: 108px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 3px; padding: 12px 12px 22px;
  }
  .card.paper .band { background: #EDE4D4; }
  .accent { height: 3px; width: 36px; border-radius: 1px; margin-bottom: 4px; flex-shrink: 0; }
  .card.diamant .art { inset: 0; }
  .card.diamant .title {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 18px 12px 40px; text-align: center;
    background: linear-gradient(to bottom, rgba(8,7,6,.78) 32%, rgba(8,7,6,0));
    pointer-events: none;
  }
  .card.diamant .title .myth-name {
    font-family: "Big Shoulders Display", Oswald, sans-serif;
    font-weight: 800; line-height: 1; letter-spacing: .06em;
    color: #F4F2EC; text-shadow: 0 1px 10px rgba(0,0,0,.55);
    text-transform: uppercase; white-space: nowrap;
  }
  .card.diamant .band {
    left: 0; right: 0; bottom: 0; height: auto;
    padding: 24px 12px 28px; text-align: center;
    background: linear-gradient(to top, rgba(8,7,6,.88) 48%, rgba(8,7,6,0));
  }
  .card.diamant .accent,
  .card.diamant .band .name,
  .card.diamant .rarete,
  .card.diamant .meta,
  .card.diamant .group { display: none; }
  .card.diamant .line-rare {
    font-size: 10px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase; color: #E8D5A3;
  }
  .card.diamant .line-info {
    margin-top: 6px; font-size: 11px; letter-spacing: .03em; color: #c8c2b6;
  }
  .name {
    font-family: Oswald, Impact, sans-serif;
    font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; line-height: 1.05; color: #F4F2EC;
  }
  .card.paper .name { color: #161410; }
  .rarete { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  .meta { font-size: 10.5px; color: #c8c2b6; letter-spacing: .02em; }
  .card.paper .meta { color: #5c564c; }
  .group { font-size: 10.5px; color: #d8b35c; letter-spacing: .03em; }
  .card.paper .group { color: #8a6a4f; }
  .marks {
    position: absolute; left: 16px; right: 16px; bottom: 10px; z-index: 2;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 8px; font-weight: 600;
    color: rgba(200,194,186,.55); pointer-events: none;
  }
  .marks .serie { letter-spacing: .12em; }
  .marks .no { letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .card.paper .marks { color: rgba(90,70,64,.45); }
  .card.diamant .marks { color: rgba(232,213,163,.55); }
  .frame { position: absolute; inset: 0; pointer-events: none; }
  .comp-meta {
    margin: 0 0 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .comp-meta .lock { color: var(--danger); }
  .comp-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(22px, 3.2vw, 30px);
    letter-spacing: .03em;
    text-transform: uppercase;
    line-height: 1;
  }
  .comp-reward {
    margin: 10px 0 0;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .comp-cta {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 16px;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
  }
  .comp-cta:hover { filter: brightness(1.06); }
  .comp-validated {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }
  .comp-modify {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
    white-space: nowrap;
  }
  .comp-modify:hover { color: var(--accent); }
  .empty {
    border: 1px dashed var(--line);
    padding: 36px 16px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase; color: #5a5650;
  }
  .foot a { text-decoration: none; }
  .foot a:hover { color: var(--ink); }

  .drawer-veil {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 92vw);
    background: var(--bg-elev); border-left: 1px solid var(--line);
    z-index: 45; padding: 18px; overflow: auto;
  }
  .drawer .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .drawer h2 {
    margin: 0; font-family: var(--font-display); font-size: 20px;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .drawer .close {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font-size: 28px; line-height: 1; cursor: pointer;
  }
  .drawer label {
    display: block; font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  .user-switch { display: flex; gap: 8px; margin-bottom: 20px; }
  .user-switch button {
    flex: 1; appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; padding: 10px; cursor: pointer;
  }
  .user-switch button.on { border-color: var(--accent); color: var(--accent); }
  .drawer .links a {
    display: block; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
    color: var(--muted); padding: 8px 0;
  }

  @media (max-width: 720px) {
    .top { grid-template-columns: 1fr auto; }
    .nav-main { grid-column: 1 / -1; justify-content: flex-start; }
    .comp { grid-template-columns: 1fr; }
    .comp-cta,
    .comp-actions { justify-self: start; }
    .comp-actions { align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="lobby.html">Charts</a>
  <nav class="nav-main" aria-label="Principal">
    <a href="lobby.html">Lobby</a>
    <a href="booster.html">Booster</a>
    <a href="classeur.html">Classeur</a>
    <a href="booster.html#marche">Marché</a>
    <a class="on" href="fantasy.html?v=15" aria-current="page">Fantasy</a>
  </nav>
  <div class="top-actions">
    <span class="chip" aria-label="Crédits">
      <span class="coin" aria-hidden="true"></span>
      <span><b id="creditsBal">0</b> CR</span>
    </span>
    <button type="button" class="chip btn" id="menuBtn" aria-label="Profil" aria-expanded="false" aria-controls="drawer" aria-haspopup="dialog">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
      <span id="playerName">Joueur A</span>
    </button>
  </div>
</header>

<main class="wrap">
  <header class="page-head">
    <h1 class="page-title">Fantasy League</h1>
    <p class="page-sub">Créé le groupe ultime et grimpe au sommet des Charts</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Compétitions">
    <button type="button" class="tab on" data-tab="all" role="tab" aria-selected="true">Toutes les compétitions</button>

    <h2 id="drawerTitle">Profil</h2>
    <button type="button" class="close" id="drawerClose" aria-label="Fermer">×</button>
  </div>

  <div class="user-switch" role="group" aria-label="Compte de test">

    <button type="button" data-user="u2">Joueur B</button>
  </div>
  <div class="links">
    <a href="legal/index.html?v=2">Mentions légales</a>
  </div>
</aside>

<script>
const USERS = { u1: "Joueur A", u2: "Joueur B" };
const ACTIVE_USER_KEY = "charts.s1.activeUser";
const EXEC = { commune:"A", argent:"B", or:"A", platine:"B", diamant:"B" };
const INSTR = {
  voix:"Voix", guitare:"Guitare", basse:"Basse", batterie:"Batterie",
  claviers:"Claviers", vents:"Vents", cordes:"Cordes", machines:"Machines"
};
const FAMILIES = {
  metal:     {label:"Métal",              fond:"#121214", a1:"#B8352F"},
  punk:      {label:"Punk & hardcore",    fond:"#141416", a1:"#E04A2F"},
  "hip-hop": {label:"Hip-hop",            fond:"#121410", a1:"#C8D44E"},
  électro:   {label:"Électronique",       fond:"#0B1220", a1:"#3FC1C9"},
  reggae:    {label:"Reggae & dub",       fond:"#0F1610", a1:"#D9B52B"},
  afro:      {label:"Afro",               fond:"#16120C", a1:"#E09A2B"},
  latin:     {label:"Latin",              fond:"#1C1210", a1:"#D4552F"},
  jazz:      {label:"Jazz",               fond:"#0E1A1C", a1:"#D8B35C"},
  blues:     {label:"Blues",              fond:"#0C1420", a1:"#4A7FB5"},
  funk:      {label:"Funk & disco",       fond:"#1A1222", a1:"#E0A32B"},
  "R&B":     {label:"R&B & soul",         fond:"#1A1012", a1:"#C47A5A"},
  country:   {label:"Country",            fond:"#171310", a1:"#C89A4A"},
  folk:      {label:"Folk",               fond:"#121710", a1:"#9CB06A"},
  world:     {label:"Musiques du monde",  fond:"#101614", a1:"#B58A4E"},
  chanson:   {label:"Chanson & variété",  fond:"#16131A", a1:"#C9869B"},
  pop:       {label:"Pop",                fond:"#1C1020", a1:"#D45E8A"},
  rock:      {label:"Rock",               fond:"#15110E", a1:"#D98A2B"}
};
const FAMILY_FROM_CATALOG = { hiphop:"hip-hop", electro:"électro", rnb:"R&B" };
const TIERS = {
  commune: { rank:0, label:"Commune", frame:"#5E6670", kind:"simple" },
  argent:  { rank:1, label:"Argent",  frame:"#8A949B", kind:"double" },
  or:      { rank:2, label:"Or",      frame:"#B08D57", kind:"filets" },
  platine: { rank:3, label:"Platine", frame:"#C3CAD1", kind:"filets" },
  diamant: { rank:4, label:"Diamant", frame:"#D8B35C", kind:"none" }
};
const CW = 260, CH = 364;
const SLOT_KEYS = ["voix", "ryt1", "ryt2", "melo1", "melo2"];
const COMPS = [
  {
    id: "all-stars-5",
    rank: 1,
    title: "All Stars — 5",
    slots: 5,
    status: "open",
    reward: 1000,
    lockHours: 18,
    href: "fantasy-lineup.html?v=21&comp=all-stars-5"
  },
  {
    id: "all-stars-4",
    rank: null,
    title: "All Stars — 4 bientôt !",
    slots: 4,
    status: "soon",
    reward: null,
    lockHours: null,
    href: null
  }
];

let activeUserId = "u1";
let tab = "all";
let byId = new Map();

const $ = id => document.getElementById(id);

function lineupKey(userId){ return `charts.s1.${userId || activeUserId}.lineup`; }
function walletKey(userId){ return `charts.s1.${userId || activeUserId}.wallet`; }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function foldRare(r){
  const t = String(r || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().trim();
  if(t === "legendaire" || t === "epique" || t === "platine") return "platine";
  if(t === "mythique" || t === "diamant") return "diamant";
  if(t === "rare" || t === "or") return "or";
  if(t === "peu commune" || t === "peucommune" || t === "argent") return "argent";
  return "commune";
}
function familyKey(f){ return FAMILY_FROM_CATALOG[f] || f; }
function plateJob(plate, rarete){
  const exec = EXEC[rarete] || "A";
  return `${plate.style}_${exec}_${plate.instrument}_${plate.pose}_${plate.costume}_${plate.venue}_${plate.sil}`;
}
function cardsFromCatalog(doc){
  const artists = Object.fromEntries((doc.artists || []).map(a => [a.qid, a]));
  const plates = Object.fromEntries((doc.plates || []).map(p => [p.id, p]));
  const groups = Object.fromEntries((doc.groups || []).map(g => [g.mbid, g]));
  const out = [];
  for(const row of doc.cards || []){
    if(row.in_booster_pool === false) continue;
    const artist = artists[row.artist_qid];
    const plate = plates[row.plate_id];
    if(!artist || !plate) continue;
    const rarete = foldRare(row.rarity_current || row.rarity_initial);
    if(!TIERS[rarete]) continue;
    const g = row.group_mbid ? groups[row.group_mbid] : null;
    out.push({
      id: row.id,
      name: artist.name,
      rarete,
      famille: familyKey(row.family),
      instrument: artist.instrument || plate.instrument,
      group: g ? g.name : null,
      job: plateJob(plate, rarete),
      rank: Number(row.rank_in_series) || 0
    });
  }
  return out;
}
function ring(x, y, w, h, rx, color, sw, op){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op ?? 1}"/>`;
}
function frameSvg(kind, rank, color){
  if(kind === "none") return "";
  let o = "";
  if(kind === "simple"){
    o += ring(4, 4, CW - 8, CH - 8, 8, color, 1.5);
  } else if(kind === "double"){
    o += ring(4, 4, CW - 8, CH - 8, 8, color, 1.5);
    o += ring(8, 8, CW - 16, CH - 16, 6, color, 0.7, 0.55);
  } else {
    o += ring(4, 4, CW - 8, CH - 8, 8, color, 1.5);
    o += ring(8, 8, CW - 16, CH - 16, 6, color, 0.7, 0.55);
    if(rank >= 3) o += ring(12, 12, CW - 24, CH - 24, 5, color, 0.7, 0.4);
  }
  return `<svg class="frame" viewBox="0 0 ${CW} ${CH}" aria-hidden="true">${o}</svg>`;
}
function renderCard(card){
  const tier = TIERS[card.rarete];
  const fam = FAMILIES[familyKey(card.famille)] || FAMILIES.rock;
  const paper = tier.rank <= 1;
  const diamant = tier.rank >= 4;
  const nameSize = card.name.length > 16 ? 16 : card.name.length > 13 ? 18 : 21;
  const n = card.name.length;
  const mythName = n > 16 ? 22 : n > 13 ? 26 : n > 10 ? 30 : 34;
  const bandStyle = paper || diamant ? "" : `background:${fam.fond};`;
  const group = card.group || "Artiste solo";
  const cls = `card r${tier.rank}${paper ? " paper" : ""}${diamant ? " diamant" : ""}`;
  const info = `${fam.label} · ${INSTR[card.instrument] || card.instrument} · ${group}`;
  return `<div class="${cls}" data-id="${esc(card.id)}">
    <div class="art"><img src="../out/illustrations/${esc(card.job)}.png" alt="" loading="lazy"></div>
    ${diamant ? `<div class="title"><div class="myth-name" style="font-size:${mythName}px">${esc(card.name)}</div></div>` : ""}
    <div class="band" style="${bandStyle}">
      <div class="accent" style="background:${fam.a1}"></div>
      <div class="name" style="font-size:${nameSize}px">${esc(card.name)}</div>
      <div class="rarete" style="color:${tier.frame}">${tier.label}</div>
      <div class="meta">${esc(fam.label)} · ${esc(INSTR[card.instrument] || card.instrument)}</div>
      <div class="group">${esc(group)}</div>
      ${diamant ? `<div class="line-rare">${tier.label}</div><div class="line-info">${esc(info)}</div>` : ""}
    </div>
    <div class="marks" aria-hidden="true"><span class="serie">S1</span><span class="no">${card.rank || 0}/2000</span></div>
    ${frameSvg(tier.kind, tier.rank, tier.frame)}
  </div>`;
}
function scaleMiniCards(){
  document.querySelectorAll(".comp-mini .card").forEach(card => {
    const wrap = card.parentElement;
    const w = wrap?.clientWidth || 56;
    card.style.transform = `scale(${w / 260})`;
  });
}
function loadLineup(){
  try {
    const data = JSON.parse(localStorage.getItem(lineupKey()) || "");
    if(data && data.slots && typeof data.slots === "object"){
      const slots = { ...data.slots };
      if(slots.basse && !slots.ryt1) slots.ryt1 = slots.basse;
      if(slots.batterie && !slots.ryt2) slots.ryt2 = slots.batterie;
      return { locked: !!data.locked, slots };
    }
  } catch {}
  return { locked: false, slots: {} };
}
function lineupCards(compId){
  if(compId !== "all-stars-5") return [];
  const lu = loadLineup();
  return SLOT_KEYS.map(key => {
    const id = lu.slots[key];
    return id ? byId.get(id) || null : null;
  });
}
function hasInscription(compId){
  if(compId !== "all-stars-5") return false;
  const lu = loadLineup();
  return SLOT_KEYS.some(k => lu.slots[k]);
}
function isLineupValidated(compId){
  if(compId !== "all-stars-5") return false;
  return !!loadLineup().locked;
}
function imgFallback(el){
  el.onerror = function(){
    this.onerror = function(){
      this.onerror = null;
      const m = this.src.replace("_x.png", "_m.png");
      if(m !== this.src) this.src = m;
    };
    const s = this.src;
    const n = s.indexOf("_B_") >= 0 ? s.replace("_B_", "_A_") : s.replace("_A_", "_B_");
    if(n !== s) this.src = n;
    else {
      this.onerror = null;
      const m = s.replace("_x.png", "_m.png");
      if(m !== s) this.src = m;
    }
  };
}

function formatCredits(n){
  return Number(n || 0).toLocaleString("fr-FR");
}

function refreshCredits(){
  let credits = 0;
  try {
    const data = JSON.parse(localStorage.getItem(walletKey()) || "");
    if(data && typeof data.credits === "number") credits = data.credits;
  } catch {}
  $("creditsBal").textContent = formatCredits(credits);
}

function syncUserUI(){
  document.querySelectorAll(".user-switch [data-user]").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.user === activeUserId);
  });
  $("playerName").textContent = USERS[activeUserId] || activeUserId;
}

function loadActiveUser(){
  const saved = localStorage.getItem(ACTIVE_USER_KEY);
  activeUserId = saved === "u2" ? "u2" : "u1";
  syncUserUI();
  refreshCredits();
}

function switchUser(nextId){
  if(nextId !== "u1" && nextId !== "u2") return;
  if(nextId === activeUserId) return;
  activeUserId = nextId;
  localStorage.setItem(ACTIVE_USER_KEY, activeUserId);
  syncUserUI();
  refreshCredits();
  render();
}

function filteredComps(){
  if(tab === "done") return COMPS.filter(c => c.status === "done");
  return COMPS;
}

function metaHtml(comp){
  const bits = [];
  if(comp.rank != null) bits.push(`#${comp.rank}`);
  bits.push(`${comp.slots} musiciens requis`);
  let html = bits.join(" · ");
  if(comp.status === "open" && comp.lockHours != null){
    html += ` · <span class="lock">Verrouillage dans ${comp.lockHours}h</span>`;
  }
  return html;
}

function render(){
  const list = filteredComps();
  const root = $("compList");
  if(!list.length){
    root.innerHTML = `<p class="empty">${
      tab === "done" ? "Aucune compétition terminée." : "Aucune compétition."
    }</p>`;
    return;
  }

  root.innerHTML = list.map(comp => {
    const soon = comp.status === "soon";
    const validated = isLineupValidated(comp.id);
    const inscribed = hasInscription(comp.id);
    let cta = "";
    if(comp.href){
      if(validated){
        const editHref = comp.href.includes("?")
          ? `${comp.href}&edit=1`
          : `${comp.href}?edit=1`;
        cta = `<div class="comp-actions">
          <span class="comp-validated">Line-up validé</span>
          <a class="comp-modify" href="${editHref}">Modifie ton line-up</a>
        </div>`;
      } else if(inscribed){
        cta = `<a class="comp-cta" href="${comp.href}">Continuer ton lineup →</a>`;
      } else {
        cta = `<a class="comp-cta" href="${comp.href}">Créer ton lineup →</a>`;
      }
    }
    const reward = comp.reward != null
      ? `<p class="comp-reward">Récompense : ${formatCredits(comp.reward)} CR</p>`
      : "";
    let minis = "";
    if(inscribed){
      const cards = lineupCards(comp.id);
      minis = `<div class="comp-minis" aria-label="Line-up">
        ${cards.map(card => card
          ? `<div class="comp-mini" title="${esc(card.name)}">${renderCard(card)}</div>`
          : `<div class="comp-mini empty" aria-hidden="true"></div>`
        ).join("")}
      </div>`;
    }
    return `<article class="comp${soon ? " soon" : ""}${minis ? " has-lineup" : ""}" role="listitem">
      <div>
        <p class="comp-meta">${metaHtml(comp)}</p>
        <h2 class="comp-title">${comp.title}</h2>
        ${reward}
      </div>
      ${minis}
      ${cta}
    </article>`;
  }).join("");
  root.querySelectorAll(".comp-mini .art img").forEach(imgFallback);
  scaleMiniCards();
}

document.querySelector(".tabs").addEventListener("click", ev => {
  const btn = ev.target.closest("[data-tab]");
  if(!btn) return;
  tab = btn.dataset.tab || "all";
  document.querySelectorAll(".tabs .tab").forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  render();
});

const menuBtn = $("menuBtn");
const drawer = $("drawer");
const veil = $("drawerVeil");
function setMenuOpen(open){
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  drawer.hidden = !open;
  veil.hidden = !open;
  if(open) refreshCredits();
}
menuBtn.addEventListener("click", () => setMenuOpen(menuBtn.getAttribute("aria-expanded") !== "true"));
$("drawerClose").addEventListener("click", () => setMenuOpen(false));
veil.addEventListener("click", () => setMenuOpen(false));
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape") setMenuOpen(false);
});
document.querySelector(".user-switch").addEventListener("click", ev => {
  const btn = ev.target.closest("[data-user]");
  if(btn) switchUser(btn.dataset.user);
});

async function boot(){
  loadActiveUser();
  try {
    const res = await fetch("../data/census/catalog_s1.json", { cache: "no-store" });
    if(res.ok){
      byId = new Map(cardsFromCatalog(await res.json()).map(c => [c.id, c]));
    }
  } catch {}
  render();
}
window.addEventListener("resize", scaleMiniCards);
boot();
</script>
</body>
</html>
