<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8e8ea" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#e8e8ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e323c"/>
      <stop offset="100%" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#1a1610"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d0b8"/>
      <stop offset="100%" stop-color="#8a8268"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/>
  <rect width="480" height="480" fill="url(#spot)"/>
  <!-- counter -->
  <rect x="40" y="300" width="400" height="28" rx="3" fill="#1c1e24" stroke="#3a3c44"/>
  <rect x="56" y="328" width="368" height="90" rx="4" fill="#101218" stroke="#2a2c32"/>
  <!-- left card -->
  <g transform="translate(98,148) rotate(-12 70 98)">
    <rect width="140" height="196" rx="8" fill="url(#cardA)" stroke="#6a7080"/>
    <rect x="12" y="14" width="116" height="116" rx="5" fill="#22262e"/>
    <rect x="22" y="146" width="96" height="8" rx="2" fill="#4a5060"/>
    <rect x="30" y="164" width="64" height="6" rx="2" fill="#303640"/>
  </g>
  <!-- right card -->
  <g transform="translate(242,138) rotate(10 70 98)">
    <rect width="140" height="196" rx="8" fill="url(#cardB)" stroke="#c0a86a"/>
    <rect x="12" y="14" width="116" height="116" rx="5" fill="#2c281e"/>
    <rect x="22" y="146" width="96" height="8" rx="2" fill="#8a7650"/>
    <rect x="30" y="164" width="64" height="6" rx="2" fill="#5a4e38"/>
  </g>
  <!-- coins -->
  <circle cx="186" cy="318" r="16" fill="url(#coin)" stroke="#e8e0c8"/>
  <circle cx="218" cy="324" r="14" fill="url(#coin)" stroke="#e8e0c8"/>
  <circle cx="248" cy="316" r="15" fill="url(#coin)" stroke="#e8e0c8"/>
  <circle cx="186" cy="318" r="7" fill="none" stroke="#5a5648" stroke-width="1.5"/>
  <circle cx="218" cy="324" r="6" fill="none" stroke="#5a5648" stroke-width="1.5"/>
  <circle cx="248" cy="316" r="6.5" fill="none" stroke="#5a5648" stroke-width="1.5"/>
</svg>
