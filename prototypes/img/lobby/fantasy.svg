<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101218"/>
      <stop offset="55%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8e8ea" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#e8e8ea" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="58%" r="40%">
      <stop offset="0%" stop-color="#c8ccd4" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#c8ccd4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- stage floor -->
  <ellipse cx="320" cy="268" rx="210" ry="28" fill="#14161c" stroke="#2a2c32"/>
  <rect x="110" y="250" width="420" height="18" rx="2" fill="#1a1c22"/>
  <!-- light beams -->
  <polygon points="180,0 250,250 140,250" fill="url(#beam)"/>
  <polygon points="320,0 360,250 280,250" fill="url(#beam)" opacity=".85"/>
  <polygon points="460,0 500,250 390,250" fill="url(#beam)" opacity=".7"/>
  <rect width="640" height="360" fill="url(#haze)"/>
  <!-- silhouettes -->
  <g fill="#050506" opacity=".92">
    <ellipse cx="250" cy="236" rx="18" ry="10"/>
    <rect x="236" y="188" width="28" height="50" rx="8"/>
    <circle cx="250" cy="176" r="14"/>
    <rect x="228" y="198" width="10" height="36" rx="3" transform="rotate(-18 233 216)"/>
    <rect x="262" y="198" width="10" height="40" rx="3" transform="rotate(22 267 218)"/>

    <ellipse cx="320" cy="238" rx="20" ry="11"/>
    <rect x="304" y="182" width="32" height="58" rx="9"/>
    <circle cx="320" cy="168" r="15"/>
    <rect x="292" y="200" width="12" height="42" rx="3" transform="rotate(-28 298 221)"/>
    <rect x="336" y="200" width="12" height="42" rx="3" transform="rotate(26 342 221)"/>
    <!-- mic stand -->
    <rect x="318" y="210" width="4" height="48" fill="#2a2c32"/>
    <circle cx="320" cy="208" r="6" fill="#3a3c44"/>

    <ellipse cx="390" cy="236" rx="17" ry="10"/>
    <rect x="377" y="190" width="26" height="48" rx="8"/>
    <circle cx="390" cy="178" r="13"/>
    <rect x="368" y="202" width="9" height="34" rx="3" transform="rotate(-14 372.5 219)"/>
    <rect x="402" y="200" width="9" height="38" rx="3" transform="rotate(18 406.5 219)"/>
  </g>
  <!-- crowd dots -->
  <g fill="#1c1e24">
    <circle cx="120" cy="300" r="3"/><circle cx="140" cy="308" r="2.5"/>
    <circle cx="160" cy="298" r="3"/><circle cx="180" cy="312" r="2"/>
    <circle cx="460" cy="302" r="3"/><circle cx="480" cy="310" r="2.5"/>
    <circle cx="500" cy="296" r="3"/><circle cx="520" cy="308" r="2"/>
    <circle cx="200" cy="320" r="2"/><circle cx="440" cy="318" r="2"/>
    <circle cx="280" cy="326" r="2.5"/><circle cx="360" cy="324" r="2"/>
  </g>
</svg>
