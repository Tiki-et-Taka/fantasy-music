<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1c22"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2d36"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8e8ea" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#e8e8ea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#spot)"/>
  <!-- binder spine -->
  <rect x="48" y="54" width="36" height="252" rx="4" fill="#0e0f12" stroke="#3a3c44"/>
  <circle cx="66" cy="110" r="7" fill="#2a2c32" stroke="#6a6e78"/>
  <circle cx="66" cy="180" r="7" fill="#2a2c32" stroke="#6a6e78"/>
  <circle cx="66" cy="250" r="7" fill="#2a2c32" stroke="#6a6e78"/>
  <!-- pages -->
  <rect x="92" y="62" width="480" height="236" rx="6" fill="#12141a" stroke="#2a2c32"/>
  <rect x="104" y="74" width="456" height="212" rx="4" fill="#0c0d11"/>
  <!-- cards -->
  <g transform="translate(128,92)">
    <rect width="88" height="124" rx="5" fill="url(#card)" stroke="#4a4e58"/>
    <rect x="8" y="10" width="72" height="72" rx="3" fill="#23262e"/>
    <rect x="14" y="92" width="60" height="6" rx="2" fill="#3a3e48"/>
    <rect x="18" y="104" width="40" height="4" rx="2" fill="#2a2e36"/>
    <rect width="88" height="124" rx="5" fill="url(#shine)"/>
  </g>
  <g transform="translate(236,92)">
    <rect width="88" height="124" rx="5" fill="url(#card)" stroke="#7a808c"/>
    <rect x="8" y="10" width="72" height="72" rx="3" fill="#2c303a"/>
    <rect x="14" y="92" width="60" height="6" rx="2" fill="#5a6070"/>
    <rect x="18" y="104" width="40" height="4" rx="2" fill="#3a4050"/>
    <rect width="88" height="124" rx="5" fill="url(#shine)"/>
  </g>
  <g transform="translate(344,92)">
    <rect width="88" height="124" rx="5" fill="url(#card)" stroke="#c0a86a"/>
    <rect x="8" y="10" width="72" height="72" rx="3" fill="#353028"/>
    <rect x="14" y="92" width="60" height="6" rx="2" fill="#8a7650"/>
    <rect x="18" y="104" width="40" height="4" rx="2" fill="#5a4e38"/>
    <rect width="88" height="124" rx="5" fill="url(#shine)"/>
  </g>
  <g transform="translate(452,92)">
    <rect width="88" height="124" rx="5" fill="url(#card)" stroke="#9aa4b4"/>
    <rect x="8" y="10" width="72" height="72" rx="3" fill="#262a34"/>
    <rect x="14" y="92" width="60" height="6" rx="2" fill="#6a7484"/>
    <rect x="18" y="104" width="40" height="4" rx="2" fill="#3a4454"/>
    <rect width="88" height="124" rx="5" fill="url(#shine)"/>
