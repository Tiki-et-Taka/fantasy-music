<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --bg-elev: #141414;
    --ink: #f2f0eb;
    --muted: #8a8680;
    --line: #2a2a2a;
    --line-hi: #3a3a3a;
    --accent: #e68a1e;
    --accent-ink: #111;
    --panel: #161616;
    --font-display: "Archivo Black", "Oswald", Impact, sans-serif;
    --font-ui: "Oswald", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    overscroll-behavior: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }

  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    opacity: .18;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* —— Header —— */
  .top {
    flex: 0 0 auto;
    z-index: 10;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
  }
  .brand {
    justify-self: start;
    font-family: var(--font-display);
    font-size: clamp(24px, 3.2vw, 32px);
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: 1;
    text-decoration: none;
  }
  .nav-main {
    justify-self: center;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 22px;
  }
  .nav-main a {
    position: relative;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 0 8px;
    transition: color .15s ease;
  }
  .nav-main a:hover { color: var(--ink); }
  .nav-main a.on {
    color: var(--ink);
  }
  .nav-main a.on::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px;
    background: var(--accent);
  }
  .top-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }
  .chip .coin {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0c060, var(--accent) 55%, #8a4a10);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
    flex: 0 0 auto;
  }
  .chip.btn {
    appearance: none;
    cursor: pointer;
    font: inherit;
    color: var(--ink);
  }
  .chip.btn:hover { border-color: var(--line-hi); background: #1c1c1c; }
  .chip .ico {
    width: 14px; height: 14px; opacity: .75;
  }

  /* —— Page —— */
  .wrap {
    flex: 1 1 auto;
    width: min(860px, calc(100% - 32px));
    margin: 0 auto;
    padding: 4px 0 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 10px;
    animation: rise .65s ease both;
  }
  .card {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    text-decoration: none;
    color: inherit;
    transition: border-color .2s ease, transform .2s ease;
  }
  .card:hover {
    border-color: var(--line-hi);
    transform: translateY(-2px);
  }
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .card-art {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: #111 center / cover no-repeat;
    border-bottom: 1px solid var(--line);
  }
  .card-booster {
    position: relative;
    grid-column: 2;
    grid-row: 1;
    border: 0;
    background: transparent;
    overflow: hidden;
    min-height: 0;
  }
  .card-booster:hover {
    border-color: transparent;
    transform: translateY(-2px);
  }
  .card-booster .card-art {
    flex: 1 1 auto;
    min-height: 0;
    border: 0;
    background: transparent;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 8px 12px 4px;
  }
  .card-booster .card-art img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(190px, 64%);
    max-height: min(310px, 82%);
    object-fit: contain;
  }
  .card-booster .card-body {
    position: absolute;
    left: 0; right: 0; top: 0;
    z-index: 2;
    padding: 22% 6% 0;
    background: none;
    pointer-events: none;
    align-items: center;
  }
  .card-booster .cta {
    display: block;
    width: auto;
    margin: 0;
    min-height: 0;
    padding: 0;
    border: 0;
    background: none;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.75);
    box-shadow: none;
    animation: labelPulse 2.4s ease-in-out infinite;
  }
  .card-booster:hover .cta { animation-duration: 1.4s; }

  @keyframes labelPulse {
    0%, 100% { color: #fff; }
    50% { color: var(--accent); }
  }
  .card-classeur { grid-column: 1; grid-row: 2; }
  .card-classeur .card-art { background-image: url("img/lobby/classeur.jpg?v=4"); }
  .card-marche { grid-column: 2; grid-row: 2; }
  .card-marche .card-art { background-image: url("img/lobby/marche.jpg?v=4"); }
  .card-fantasy { grid-column: 3; grid-row: 2; }
  .card-fantasy .card-art { background-image: url("img/lobby/fantasy.jpg?v=4"); }
  .card-tag {
    position: absolute; top: 8px; left: 10px; z-index: 1;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: .06em;
    color: #c8c4bc;
    text-shadow: 0 1px 8px #000;
  }
  .card-body {
    flex: 0 0 auto;
    padding: 8px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(16px, 2vw, 20px);
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: 1;
  }
  .card-sub {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.35;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: .02em;
    text-transform: none;
  }
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 4px;
    min-height: 30px;
    padding: 6px 10px;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-decoration: none;
    pointer-events: none;
  }

  .foot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    animation: rise .7s ease .14s both;
  }
  .foot-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .04em;
    color: #6a6660;
    text-transform: uppercase;
  }
  .foot a {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
  }
  .foot a:hover { color: var(--ink); }

  /* —— Drawer —— */
  .drawer-veil {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .drawer-veil.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 21;
    width: min(320px, 88vw);
    background: #101010;
    border-left: 1px solid var(--line);
    padding: 22px 20px;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; gap: 22px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .head {
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer .head h2 {
    margin: 0;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .drawer .close {
    appearance: none; border: 0; background: none;
    color: var(--muted); font-size: 22px; line-height: 1;
    cursor: pointer; padding: 4px 8px;
  }
  .drawer .close:hover { color: var(--ink); }
  .drawer .block label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px; color: var(--muted);
    letter-spacing: .14em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .user-switch {
    display: inline-flex; gap: 0; border: 1px solid var(--line);
    overflow: hidden; background: var(--panel);
  }
  .user-switch button {
    appearance: none; border: 0; background: transparent;
    color: var(--muted); font: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 14px; cursor: pointer;
  }
  .user-switch button.on { background: var(--accent); color: var(--accent-ink); }
  .user-switch button:hover:not(.on) { color: var(--ink); }
  .drawer .links { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .drawer .links a {
    color: var(--muted); text-decoration: none;
    font-family: var(--font-mono); font-size: 12px;
  }
  .drawer .links a:hover { color: var(--ink); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 820px) {
    body { overflow: auto; height: auto; min-height: 100%; }
    .top {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      padding: 12px 12px 6px;
    }
    .brand { grid-column: 1; }
    .top-actions { grid-column: 2; }
    .nav-main {
      grid-column: 1 / -1;
      justify-content: flex-start;
      gap: 8px 14px;
      padding-top: 4px;
      overflow-x: auto;
      flex-wrap: nowrap;
    }
    .wrap {
      width: calc(100% - 20px);
      height: auto;
      flex: none;
      padding-bottom: 20px;
    }
    .grid {
      flex: none;
      height: auto;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto;
      gap: 8px;
    }
    .card-art { aspect-ratio: 16 / 10; flex: none; min-height: 100px; }
    .card-booster {
      grid-column: 1 / -1;
      grid-row: 1;
    }
    .card-booster .card-art {
      aspect-ratio: 16 / 11;
      min-height: 140px;
    }
    .card-booster .card-art img {
      max-width: min(140px, 48%);
      max-height: min(210px, 82%);
    }
    .card-classeur { grid-column: 1; grid-row: 2; }
    .card-marche { grid-column: 2; grid-row: 2; }
    .card-fantasy { grid-column: 1 / -1; grid-row: 3; }
    .foot { flex-direction: column; align-items: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    .grid, .foot { animation: none; }
    .card { transition: none; }
    .card-booster .cta { animation: none; color: var(--accent); }
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="lobby.html">Charts</a>
  <nav class="nav-main" aria-label="Principal">
    <a class="on" href="lobby.html" aria-current="page">Lobby</a>
    <a href="booster.html">Booster</a>
    <a href="classeur.html">Classeur</a>
    <a href="booster.html#marche">Marché</a>
    <a href="fantasy.html?v=15">Fantasy</a>
  </nav>
  <div class="top-actions">
    <span class="chip" aria-label="Crédits">
      <span class="coin" aria-hidden="true"></span>
      <span><b id="creditsBal">0</b> CR</span>
    </span>
    <button type="button" class="chip btn" id="menuBtn" aria-label="Profil" aria-expanded="false" aria-controls="drawer" aria-haspopup="dialog">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
      <span id="playerName">Joueur A</span>
    </button>
  </div>
</header>

<main class="wrap">
  <nav class="grid" aria-label="Accès rapides">
    <a class="card card-booster" href="booster.html" aria-label="Ouvrir un booster">
      <div class="card-art">
        <img src="img/lobby/booster.png?v=19" alt="">
      </div>
      <div class="card-body">
        <span class="cta">Ouvrir un booster</span>
      </div>
    </a>
    <a class="card card-classeur" href="classeur.html">
      <div class="card-art" role="img" aria-label=""></div>
      <div class="card-body">
        <h2 class="card-title">Classeur</h2>
        <p class="card-sub">Consulter la collection</p>
      </div>
    </a>
    <a class="card card-marche" href="booster.html#marche">
      <div class="card-art" role="img" aria-label=""></div>
      <div class="card-body">
        <h2 class="card-title">Marché</h2>
        <p class="card-sub">Acheter, céder &amp; négocier en direct</p>
      </div>
    </a>
    <a class="card card-fantasy" href="fantasy.html?v=15">
      <div class="card-art" role="img" aria-label=""></div>
      <div class="card-body">
        <h2 class="card-title">Fantasy</h2>
        <p class="card-sub">Composer le line-up hebdo &amp; dominer l’arène</p>
      </div>
    </a>
  </nav>

  <footer class="foot">
    <a href="legal/index.html?v=2">Mentions légales</a>
  </footer>
</main>

<div class="drawer-veil" id="drawerVeil" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="head">
    <h2 id="drawerTitle">Profil</h2>
    <button type="button" class="close" id="drawerClose" aria-label="Fermer">×</button>
  </div>
  <div class="block">
    <label>Compte de test</label>
    <div class="user-switch" role="group" aria-label="Compte de test">
      <button type="button" data-user="u1" id="userBtnA" class="on">Joueur A</button>
      <button type="button" data-user="u2" id="userBtnB">Joueur B</button>
    </div>
  </div>
  <div class="links">
    <a href="legal/index.html?v=2">Mentions légales</a>
  </div>
</aside>

<script>
const ACTIVE_USER_KEY = "charts.s1.activeUser";
const USERS = { u1: "Joueur A", u2: "Joueur B" };
let activeUserId = "u1";

function walletKey(userId){
  return `charts.s1.${userId || activeUserId}.wallet`;
}
function formatCredits(n){
  return Number(n || 0).toLocaleString("fr-FR");
}
function loadActiveUser(){
  const saved = localStorage.getItem(ACTIVE_USER_KEY);
  activeUserId = saved === "u2" ? "u2" : "u1";
  syncUserSwitchUI();
  refreshCredits();
}
function syncUserSwitchUI(){
  document.querySelectorAll(".user-switch [data-user]").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.user === activeUserId);
  });
  const nameEl = document.getElementById("playerName");
  if(nameEl) nameEl.textContent = USERS[activeUserId] || activeUserId;
}
function refreshCredits(){
  let credits = 0;
  try {
    const data = JSON.parse(localStorage.getItem(walletKey()) || "");
    if(data && typeof data.credits === "number") credits = data.credits;
  } catch {}
  const el = document.getElementById("creditsBal");
  if(el) el.textContent = formatCredits(credits);
}
function switchUser(nextId){
  if(nextId !== "u1" && nextId !== "u2") return;
  if(nextId === activeUserId) return;
  activeUserId = nextId;
  localStorage.setItem(ACTIVE_USER_KEY, activeUserId);
  syncUserSwitchUI();
  refreshCredits();
}

const menuBtn = document.getElementById("menuBtn");
const drawer = document.getElementById("drawer");
const veil = document.getElementById("drawerVeil");
const drawerClose = document.getElementById("drawerClose");

function setMenuOpen(open){
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  drawer.hidden = !open;
  veil.hidden = !open;
  drawer.classList.toggle("open", open);
  veil.classList.toggle("open", open);
  if(open) refreshCredits();
}
menuBtn.addEventListener("click", () => setMenuOpen(menuBtn.getAttribute("aria-expanded") !== "true"));
drawerClose.addEventListener("click", () => setMenuOpen(false));
veil.addEventListener("click", () => setMenuOpen(false));
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape") setMenuOpen(false);
});
document.querySelector(".user-switch")?.addEventListener("click", ev => {
  const btn = ev.target.closest("[data-user]");
  if(!btn) return;
  switchUser(btn.dataset.user);
});

loadActiveUser();
</script>
</body>
</html>
